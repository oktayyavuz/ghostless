<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotoğraf öncelikli belgesel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --white: #f6f2ea; --black: #0d0d0c; --mute: rgba(246,242,234,.68); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--black); color: var(--white); overflow: hidden; font: 400 13px/1.45 "Hanken Grotesk", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }

  .hero { position: relative; height: 642px; overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%;
              filter: contrast(1.08) saturate(.78) sepia(.12) brightness(.96); }
  .hero::after { content: ""; position: absolute; inset: 0;
                 background: linear-gradient(to bottom, rgba(10,10,10,.42), transparent 18%, transparent 58%, rgba(10,10,10,.62)); }
  header { position: absolute; z-index: 2; left: 36px; right: 36px; top: 26px; display: flex; align-items: baseline; gap: 28px; }
  .logo { font: 400 23px/1 Spectral, Georgia, serif; letter-spacing: .01em; }
  header nav { margin-left: auto; display: flex; gap: 26px; font-weight: 500; }
  header .open { color: var(--mute); }

  .cap { position: absolute; z-index: 2; left: 36px; right: 36px; bottom: 30px; display: grid; grid-template-columns: 640px 1fr auto; gap: 40px; align-items: end; }
  h1 { font: 300 52px/1.04 Spectral, Georgia, serif; letter-spacing: -.015em; }
  h1 i { font-style: italic; }
  .cap p { color: var(--mute); max-width: 36ch; font-size: 14px; }
  .cap p b { color: var(--white); font-weight: 500; }
  .count { text-align: right; font-weight: 500; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .count span { display: block; width: 120px; height: 1px; background: rgba(246,242,234,.35); margin-top: 10px; position: relative; }
  .count span::after { content: ""; position: absolute; left: 0; top: 0; height: 1px; width: 25%; background: var(--white); }

  .sheet { display: grid; grid-template-columns: 236px repeat(4, 1fr); gap: 14px; padding: 18px 36px 0; height: 158px; }
  .sheet .lab { color: var(--mute); padding-top: 2px; }
  .sheet .lab b { display: block; color: var(--white); font: 400 20px/1.15 Spectral, serif; margin-bottom: 8px; }
  .sheet figure img { width: 100%; height: 112px; object-fit: cover; display: block; filter: contrast(1.06) saturate(.78) sepia(.12); }
  .sheet figcaption { display: flex; gap: 8px; margin-top: 7px; color: var(--mute); font-size: 12px; }
  .sheet figcaption b { color: var(--white); font-weight: 500; }

  @media (max-width: 700px) {
    header { left: 16px; right: 16px; } header nav a:not(:last-child), header .open { display: none; }
    .hero { height: 70vh; } .cap { left: 16px; right: 16px; grid-template-columns: 1fr; gap: 12px; } h1 { font-size: 34px; }
    .count { display: none; } .sheet { grid-template-columns: 1fr 1fr; padding: 16px; } .sheet .lab { grid-column: 1 / 3; }
  }
</style>
</head>
<body>
  <section class="hero">
    <img src="../../assets/deniz.webp" alt="Karaköy'den kalkan vapurdan şehir siluetine bakış">
    <header>
      <a class="logo" href="#">Lodos</a><span class="open">Kahve Kavurma Evi, Karaköy</span>
      <nav><a href="#">Kavurma</a><a href="#">Çekirdekler</a><a href="#">Menü</a><a href="#">İskele</a></nav>
    </header>
    <div class="cap">
      <h1>Vapur kalkmadan<br><i>kahven hazır.</i></h1>
      <p><b>08.10, Karaköy–Kadıköy vapuru.</b> İskeleye 90 saniye uzaktayız; kalkışa 6 dakika kala gelen sıra beklemez.</p>
      <div class="count">01 / 04<span></span></div>
    </div>
  </section>

  <section class="sheet">
    <div class="lab"><b>Bir sabah, dört kare</b>Kemankeş Cd. 12 · Hafta içi 07.00–19.00</div>
    <figure><img src="../../assets/barista.webp" alt="Barista elleri ve portafiltre"><figcaption><b>07.00</b> Kazan ısınırken ilk shot</figcaption></figure>
    <figure><img src="../../assets/cekirdek.webp" alt="Çuval bezi üstünde fincan ve çekirdekler"><figcaption><b>07.30</b> Lodos harmanı, taze kavrum</figcaption></figure>
    <figure><img src="../../assets/espresso.webp" alt="İki fincana akan espresso"><figcaption><b>08.02</b> Kalkışa altı dakika</figcaption></figure>
    <figure><img src="../../assets/kopru.webp" alt="Gün batımında Boğaz Köprüsü"><figcaption><b>18.40</b> Son vapur, son fincan</figcaption></figure>
  </section>

<script>
  const img = document.querySelector(".hero img");
  const ui = document.querySelectorAll("header, .cap");
  const shots = document.querySelectorAll(".sheet > *");
  window.demo = {
    duration: 2600,
    render(p) {
      const k = gl.easeOutQuart(gl.seg(p, 0, 1));
      img.style.transform = `scale(${1.1 - 0.1 * k})`;
      img.style.opacity = gl.easeOutQuart(gl.seg(p, 0, 0.35));
      const u = gl.easeOutQuart(gl.seg(p, 0.35, 0.8));
      ui.forEach((el) => { el.style.opacity = u; });
      shots.forEach((el, i) => { el.style.opacity = gl.easeOutQuart(gl.seg(p, 0.5 + i * 0.08, 0.8 + i * 0.05)); });
    },
  };
</script>
<script src="../_runtime.js"></script>
</body>
</html>
