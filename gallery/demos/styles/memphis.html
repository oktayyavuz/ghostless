<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memphis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --cream: #fff3e2; --ink: #141414; --pink: #ff7eb3; --yellow: #ffcf2e; --teal: #12b5a5; --cobalt: #2f45e0; --orange: #ff5f2e; --lilac: #b7a4ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { overflow: hidden; position: relative; background: var(--cream); color: var(--ink); font: 500 18px/1.45 "Rubik", system-ui, sans-serif; }
  .mono { font-family: "Rubik Mono One", "Rubik", sans-serif; font-weight: 400; }
  .abs { position: absolute; }

  header { left: 56px; right: 56px; top: 30px; display: flex; align-items: center; gap: 14px; z-index: 4; }
  .logo { font-size: 34px; letter-spacing: -.02em; margin-right: auto; position: relative; }
  .logo svg { position: absolute; left: 0; bottom: -16px; width: 100%; height: 16px; }
  nav a { display: inline-block; padding: 8px 18px; border: 3px solid var(--ink); border-radius: 40px; font-weight: 700; font-size: 16px; background: var(--cream); }
  nav a:nth-child(1) { background: var(--lilac); }
  .order { padding: 10px 22px; border-radius: 40px; background: var(--ink); color: var(--yellow); font-weight: 800; font-size: 16px; margin-left: 10px; }

  h1 { left: 56px; top: 142px; width: 640px; font-size: 76px; line-height: 1.02; letter-spacing: -.04em; text-transform: uppercase; z-index: 3; }
  h1 .w { display: inline-block; }
  h1 .blk { background: var(--yellow); padding: 0 12px; border: 4px solid var(--ink); rotate: -3deg; margin: 6px 0 2px -6px; }
  h1 .pk { color: var(--pink); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  .lede { left: 60px; top: 478px; width: 470px; font-size: 20px; line-height: 1.45; z-index: 3; }
  .lede b { font-weight: 800; background: linear-gradient(transparent 60%, var(--teal) 60%); }
  .ctas { left: 60px; top: 580px; display: flex; gap: 14px; z-index: 3; }
  .btn { padding: 15px 28px; border-radius: 50px; border: 3px solid var(--ink); font-weight: 800; font-size: 18px; background: var(--pink); }
  .btn.alt { background: var(--cream); }

  .photo { left: 742px; top: 128px; width: 410px; height: 410px; border-radius: 50%; overflow: hidden; border: 5px solid var(--ink); z-index: 2; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; display: block; }
  .arch { left: 1074px; top: 440px; width: 170px; height: 220px; border-radius: 90px 90px 0 0; overflow: hidden; border: 5px solid var(--ink); z-index: 3; }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 44% 50%; display: block; }
  .sticker { left: 700px; top: 470px; width: 150px; height: 150px; z-index: 4; }

  .shapes { inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .shapes .front { z-index: 5; }
  .shapes g { transform-box: fill-box; transform-origin: center; }

  /* second section: cobalt band with a wavy top */
  .band { left: 0; right: 0; top: 690px; bottom: 0; background: var(--cobalt); z-index: 3; padding: 44px 56px 0; color: var(--cream); }
  .band::before { content: ""; position: absolute; left: 0; right: 0; top: -22px; height: 24px;
                  background: radial-gradient(circle at 20px 24px, var(--cobalt) 19px, transparent 20px) 0 0 / 40px 24px repeat-x; }
  .band h2 { font-size: 30px; letter-spacing: -.03em; display: inline-block; margin-right: 24px; vertical-align: middle; }
  .chips { display: inline-flex; gap: 10px; vertical-align: middle; }
  .chips span { padding: 6px 16px; border-radius: 30px; border: 3px solid var(--ink); color: var(--ink); font-weight: 700; font-size: 16px; }

  @media (max-width: 700px) {
    nav, .photo, .arch, .sticker, .shapes, .band { display: none; }
    header { left: 16px; right: 16px; }
    h1 { left: 16px; width: 340px; font-size: 40px; top: 110px; }
    .lede { left: 16px; width: 340px; top: 360px; } .ctas { left: 16px; top: 520px; } .btn { padding: 12px 18px; font-size: 16px; white-space: nowrap; }
  }
</style>
</head>
<body>
  <header class="abs">
    <div class="logo mono">Lodos
      <svg viewBox="0 0 150 16" preserveAspectRatio="none"><path d="M2 8 Q 11 0 20 8 T 38 8 T 56 8 T 74 8 T 92 8 T 110 8 T 128 8 T 146 8" fill="none" stroke="#ff5f2e" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <nav><a>Menü</a> <a>Çekirdekler</a> <a>İskele</a></nav>
    <span class="order">Sipariş ver</span>
  </header>

  <svg class="abs shapes" viewBox="0 0 1280 800" aria-hidden="true">
    <defs>
      <pattern id="st" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#ffcf2e"/><rect width="6" height="14" fill="#141414"/></pattern>
      <pattern id="st2" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="12" height="12" fill="#fff3e2"/><rect width="5" height="12" fill="#2f45e0"/></pattern>
    </defs>
    <!-- big offset disc behind the photo -->
    <g data-pop=".05"><circle cx="980" cy="358" r="205" fill="#ff7eb3" stroke="#141414" stroke-width="5"/></g>
    <!-- striped half disc -->
    <g data-pop=".12"><path d="M690 250 A 92 92 0 0 1 874 250 Z" fill="url(#st)" stroke="#141414" stroke-width="5" transform="rotate(-24 782 250)"/></g>
    <!-- teal quarter / lilac slab -->
    <g data-pop=".18"><rect x="1150" y="96" width="92" height="150" rx="0" fill="#12b5a5" stroke="#141414" stroke-width="5" transform="rotate(14 1196 171)"/></g>
    <g data-pop=".22"><path d="M590 640 L 690 560 L 700 680 Z" fill="#12b5a5" stroke="#141414" stroke-width="5"/></g>
    <!-- squiggles -->
    <g data-pop=".26"><path d="M600 112 q 16 -26 32 0 t 32 0 t 32 0 t 32 0" fill="none" stroke="#2f45e0" stroke-width="8" stroke-linecap="round"/></g>
    <g data-pop=".3"><path d="M1170 300 q 22 14 0 28 t 0 28 t 0 28 t 0 28" fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round"/></g>
    <g data-pop=".34"><path d="M880 600 l 22 -22 l 22 22 l 22 -22 l 22 22 l 22 -22" fill="none" stroke="#ff5f2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- confetti -->
    <g data-pop=".36"><path d="M545 168 l 26 -6 l -8 24 z" fill="#ffcf2e" stroke="#141414" stroke-width="4" stroke-linejoin="round"/></g>
    <g data-pop=".38"><rect x="640" y="388" width="44" height="12" rx="6" fill="#ff7eb3" stroke="#141414" stroke-width="4" transform="rotate(-35 662 394)"/></g>
    <g data-pop=".4"><circle cx="1230" cy="640" r="20" fill="#ffcf2e" stroke="#141414" stroke-width="4"/></g>
    <g data-pop=".42"><rect x="520" y="420" width="36" height="10" rx="5" fill="#2f45e0" transform="rotate(30 538 425)"/></g>
    <g data-pop=".44"><path d="M1000 90 l 18 -30 l 18 30 z" fill="#b7a4ff" stroke="#141414" stroke-width="4" stroke-linejoin="round"/></g>
    <g data-pop=".46"><circle cx="900" cy="98" r="9" fill="#ff5f2e"/></g>
    <g data-pop=".48"><rect x="400" y="600" width="40" height="11" rx="5" fill="#ffcf2e" stroke="#141414" stroke-width="4" transform="rotate(20 420 605)"/></g>
    <g data-pop=".5"><path d="M470 120 q 10 -16 20 0 t 20 0" fill="none" stroke="#12b5a5" stroke-width="6" stroke-linecap="round"/></g>
    <g data-pop=".52"><path d="M1010 650 h60 v18 h-60z" fill="url(#st2)" stroke="#141414" stroke-width="4" transform="rotate(-12 1040 659)"/></g>
  </svg>

  <h1 class="abs mono" aria-label="Vapur kalkmadan kahven hazır.">
    <span class="w" data-in="0,.3">Vapur</span><br>
    <span class="w" data-in=".06,.36">kalkmadan</span><br>
    <span class="w blk" data-in=".12,.42">kahven</span>
    <span class="w pk" data-in=".18,.48">hazır.</span>
  </h1>
  <p class="abs lede" data-in=".25,.55">Her sabah 07.00'de, 12 kg'lık tek kazanla kavuruyoruz. <b>Karaköy iskelesine 90 saniye.</b></p>
  <div class="abs ctas" data-in=".3,.6"><span class="btn">Menüye bak</span><span class="btn alt">Nasıl gelinir?</span></div>

  <div class="abs photo" data-pop=".1"><img src="../../assets/barista.webp" alt="Barista portafiltreden fincana espresso alıyor"></div>
  <div class="abs arch" data-pop=".28"><img src="../../assets/kopru.webp" alt="Gün batımında Boğaz Köprüsü"></div>
  <svg class="abs sticker" viewBox="0 0 150 150" data-pop=".4" aria-hidden="true">
    <defs><path id="ring" d="M75 75 m -50 0 a 50 50 0 1 1 100 0 a 50 50 0 1 1 -100 0"/></defs>
    <circle cx="75" cy="75" r="70" fill="#ffcf2e" stroke="#141414" stroke-width="5"/>
    <text font-family="Rubik" font-weight="800" font-size="15" letter-spacing="2.4" fill="#141414"><textPath href="#ring">KALKIŞA 6 DAKİKA · SIRA YOK ·</textPath></text>
    <text x="75" y="84" text-anchor="middle" font-family="Rubik Mono One" font-size="26" fill="#141414">6 dk</text>
  </svg>

  <section class="abs band">
    <h2 class="mono">Bu hafta kazanda</h2>
    <div class="chips"><span style="background:#ffcf2e">Lodos harmanı</span><span style="background:#ff7eb3">Etiyopya Guji</span><span style="background:#12b5a5">Kolombiya Huila</span><span style="background:#b7a4ff">Türk kahvesi kavrumu</span></div>
  </section>

<script>
  const words = [...document.querySelectorAll("[data-in]")];
  const pops = [...document.querySelectorAll("[data-pop]")];
  const back = (x) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  window.demo = {
    duration: 2000, hold: 5000,
    render(p) {
      words.forEach((el) => {
        const [a, b] = el.dataset.in.split(",").map(Number);
        const t = gl.seg(p, a, b);
        el.style.opacity = t > 0 ? 1 : 0;
        el.style.translate = `0 ${(1 - back(t)) * 60}px`;
      });
      pops.forEach((el) => {
        const a = +el.dataset.pop, t = gl.seg(p, a, a + 0.35);
        el.style.scale = t <= 0 ? 0 : back(t);
      });
    },
  };
</script>
<script src="../_runtime.js"></script>
</body>
</html>
