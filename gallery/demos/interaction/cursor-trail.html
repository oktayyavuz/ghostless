<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İmleç izinde görseller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #24130f; --cream: #f6e7cf; --peach: #f0a37c; --quiet: #a88f80; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--cream); font: 400 16px/1.5 Outfit, system-ui, sans-serif; overflow: hidden; position: relative; }
  header { position: absolute; left: 56px; right: 56px; top: 34px; display: flex; justify-content: space-between; z-index: 2; }
  header b { font: 400 26px/1 "Young Serif", Georgia, serif; }
  header span { color: var(--quiet); }
  h1 { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-54%); text-align: center; font: 400 clamp(56px, 10.5vw, 150px)/.92 "Young Serif", Georgia, serif;
       letter-spacing: -.01em; z-index: 1; }
  h1 em { font-style: normal; color: var(--peach); }
  .foot { position: absolute; left: 56px; right: 56px; bottom: 36px; display: flex; justify-content: space-between; color: var(--quiet); z-index: 2; }
  .foot b { color: var(--cream); font-weight: 500; }
  .tr { position: absolute; left: 0; top: 0; width: 190px; height: 236px; margin: -118px 0 0 -95px; overflow: hidden; z-index: 3; will-change: transform, opacity; border-radius: 3px; }
  .tr img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cursor { position: absolute; left: 0; top: 0; width: 24px; height: 30px; z-index: 40; pointer-events: none; }
  @media (max-width: 700px) { .tr { width: 110px; height: 140px; margin: -70px 0 0 -55px; } header, .foot { left: 20px; right: 20px; } .foot span:last-child { display: none; } }
</style>
</head>
<body>
  <header><b>Lodos</b><span>Kahve Kavurma Evi · Karaköy</span></header>
  <h1>Karaköy'de<br><em>bir sabah.</em></h1>
  <div class="foot"><span><b>Her sabah 07.00'de</b> kavuruyoruz. İskeleye 90 saniye.</span><span>Kemankeş Cd. 12</span></div>
  <div id="trail"></div>
  <svg class="cursor" viewBox="0 0 22 28" aria-hidden="true"><path d="M2 2 L2 22 L7.5 17 L11 25.5 L14.5 24 L11 15.8 L18.5 15.8 Z" fill="#f6e7cf" stroke="#24130f" stroke-width="1.8" stroke-linejoin="round"/></svg>
<script>
  const SRC = ["kopru", "espresso", "cekirdek", "barista", "deniz", "kavurucu", "fincan"];
  const trail = document.getElementById("trail"), cursor = document.querySelector(".cursor");
  const N = 14;
  const imgs = Array.from({ length: N }, (_, k) => {
    const d = document.createElement("div"); d.className = "tr";
    const im = document.createElement("img"); im.src = `../../assets/${SRC[k % SRC.length]}.webp`; im.alt = "";
    d.appendChild(im); trail.appendChild(d); return d;
  });
  // the pointer's path: a loose S across the page, ending to the right of the headline
  function at(u) {
    const W = innerWidth, H = innerHeight;
    return [gl.lerp(W * 0.1, W * 0.8, u) + Math.sin(u * Math.PI * 2) * W * 0.05,
            H * 0.5 + Math.sin(u * Math.PI * 2.6 + 0.6) * H * 0.26];
  }
  const SPAN = 0.86;  // the pointer moves for this much of the timeline
  window.demo = {
    duration: 4400,
    render(p) {
      const u = gl.seg(p, 0, SPAN);
      const [x, y] = at(u);
      cursor.style.transform = `translate(${x}px, ${y}px)`;
      imgs.forEach((el, k) => {
        const born = (k / (N - 1)) * SPAN * 0.98;   // drop an image every few steps along the path
        const age = p - born;
        const last = k >= N - 3;                    // the last few stay where the pointer stopped
        if (age < 0) { el.style.opacity = 0; return; }
        const [ix, iy] = at(gl.seg(born, 0, SPAN));
        const grow = gl.easeOutQuart(gl.clamp(age / 0.04));
        const die = last ? 0 : gl.easeInOutCubic(gl.seg(age, 0.1, 0.22));
        const rot = ((k % 3) - 1) * 5;
        el.style.transform = `translate(${ix}px, ${iy + die * 40}px) rotate(${rot}deg) scale(${(0.6 + 0.4 * grow) * (1 - 0.4 * die)})`;
        el.style.opacity = (Math.min(1, grow * 1.4) * (1 - die)).toFixed(3);
        el.style.zIndex = 3 + k;
      });
    },
  };
</script>
<script src="../_runtime.js"></script>
</body>
</html>
