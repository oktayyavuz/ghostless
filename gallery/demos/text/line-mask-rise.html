<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maskeli satır yükselişi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #efe7da; --ink: #1d1a17; --rust: #b4532a; --quiet: #6f655a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 "Instrument Sans", system-ui, sans-serif;
         display: grid; grid-template-columns: 1.15fr 1fr; overflow: hidden; }
  .copy { padding: 9vh 5vw; display: flex; flex-direction: column; justify-content: space-between; }
  .meta { display: flex; justify-content: space-between; color: var(--quiet); font-size: 14px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: clamp(44px, 6.4vw, 92px);
       line-height: .98; letter-spacing: -.02em; }
  .line { display: block; overflow: hidden; padding-bottom: .06em; }
  .line > span { display: block; will-change: transform; }
  h1 em { font-style: italic; font-weight: 500; color: var(--rust); }
  .foot { display: flex; gap: 32px; align-items: end; }
  .foot p { max-width: 30ch; color: var(--quiet); }
  .foot b { color: var(--ink); font-weight: 500; }
  figure { position: relative; overflow: hidden; }
  figure img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  figcaption { position: absolute; left: 20px; bottom: 18px; color: #f4efe6; font-size: 13px; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 38vh; } }
</style>
</head>
<body>
  <section class="copy">
    <div class="meta"><span>Lodos · Karaköy</span><span>Kavurma: her sabah 07.00</span></div>
    <h1 aria-label="Vapur kalkmadan kahven hazır.">
      <span class="line" aria-hidden="true"><span>Vapur</span></span>
      <span class="line" aria-hidden="true"><span>kalkmadan</span></span>
      <span class="line" aria-hidden="true"><span><em>kahven</em> hazır.</span></span>
    </h1>
    <div class="foot">
      <p><b>İskeleye 90 saniye.</b> Kalkışa 6 dakika kala sipariş verene sıra yok.</p>
      <p>Kemankeş Cd. 12<br>Hafta içi 07.00–19.00</p>
    </div>
  </section>
  <figure>
    <img src="../../assets/barista.webp" alt="Portafiltreden fincana akan espresso">
    <figcaption>12 kg'lık tek kazan, sabah ilk kavrum</figcaption>
  </figure>
<script>
  const lines = [...document.querySelectorAll(".line > span")];
  const img = document.querySelector("figure img");
  const meta = document.querySelectorAll(".meta, .foot");
  window.demo = {
    duration: 2200,
    render(p) {
      lines.forEach((el, i) => {
        const t = gl.easeOutQuart(gl.seg(p, i * 0.12, 0.55 + i * 0.12));
        el.style.transform = `translateY(${(1 - t) * 115}%)`;
      });
      const m = gl.easeOutQuart(gl.seg(p, 0.45, 1));
      meta.forEach((el) => (el.style.opacity = m));
      const k = gl.easeOutQuart(gl.seg(p, 0, 0.9));
      img.style.transform = `scale(${1.18 - 0.18 * k})`;
    },
  };
</script>
<script src="../_runtime.js"></script>
</body>
</html>
