<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetik sekans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --night: #121010; --cream: #f2e9d8; --red: #e5462a; --sea: #1e5aa6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--cream); font: 500 15px/1.4 Archivo, system-ui, sans-serif; overflow: hidden; position: relative; }
  .band { position: absolute; left: 0; right: 0; height: 25vh; }
  .band .bg { position: absolute; left: 0; right: 0; top: 0; height: 100%; }
  .word { position: absolute; left: 3.2vw; top: 50%; font-family: Anton, Impact, sans-serif; font-size: 23.5vh; line-height: 1; white-space: nowrap;
          text-transform: uppercase; letter-spacing: -.005em; transform-origin: 50% 50%; will-change: transform; margin-top: -.53em; }
  .note { position: absolute; right: 3.2vw; bottom: 2.4vh; text-align: right; font-weight: 700; font-size: 15px; letter-spacing: .02em; max-width: 22ch; }
  .note small { display: block; font-weight: 500; opacity: .75; font-size: 13px; }
  .b0 .bg { background: var(--night); } .b0 { color: var(--cream); }
  .b1 .bg { background: var(--red); }   .b1 { color: var(--night); }
  .b2 .bg { background: var(--cream); } .b2 { color: var(--night); }
  .b3 .bg { background: var(--sea); }   .b3 { color: var(--cream); }
  .b0 .bg { border-bottom: 1px solid rgba(242,233,216,.12); }
  @media (max-width: 700px) { .note { display: none; } .word { font-size: 13vw; margin-top: -.55em; } }
</style>
</head>
<body aria-label="Vapur kalkmadan kahven hazır.">
  <div class="band b0" style="top:0"><div class="bg"></div><div class="word" aria-hidden="true">Vapur</div><p class="note">Karaköy iskelesi<small>Lodos'tan 90 saniye</small></p></div>
  <div class="band b1" style="top:25vh"><div class="bg"></div><div class="word" aria-hidden="true">Kalkmadan</div><p class="note">6 dakika kala sipariş ver<small>sıra bekleme</small></p></div>
  <div class="band b2" style="top:50vh"><div class="bg"></div><div class="word" aria-hidden="true">Kahven</div><p class="note">Bu sabah 07.00'de kavruldu<small>12 kg'lık tek kazan</small></p></div>
  <div class="band b3" style="top:75vh"><div class="bg"></div><div class="word" aria-hidden="true">Hazır.</div><p class="note">Lodos Kahve Kavurma Evi<small>Kemankeş Cd. 12, Karaköy</small></p></div>
<script>
  const bands = [...document.querySelectorAll(".band")].map((b) => ({
    b, bg: b.querySelector(".bg"), w: b.querySelector(".word"), n: b.querySelector(".note"),
  }));
  const backOut = (x, s = 1.6) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  window.demo = {
    duration: 3600,
    render(p) {
      const vw = innerWidth, vh = innerHeight;
      bands.forEach(({ b, bg, w, n }, i) => {
        const s = 0.02 + i * 0.22;
        const slam = gl.seg(p, s, s + 0.08);            // word hits the screen, huge
        const move = gl.easeInOutExpo(gl.seg(p, s + 0.11, s + 0.24)); // then drops into its row
        // geometry: from viewport centre at "fill the width" scale to its row
        const r = b.getBoundingClientRect();
        const ww = w.offsetWidth, wh = w.offsetHeight;
        const fx = r.left + w.offsetLeft + ww / 2;
        const S = Math.min((vw * 0.94) / ww, (vh * 0.8) / wh);
        const dx = vw / 2 - fx, dy = vh / 2 - (r.top + r.height / 2);
        const sc = gl.lerp(S * gl.lerp(1.6, 1, backOut(slam)), 1, move);
        w.style.transform = `translate(${(dx * (1 - move)).toFixed(1)}px, ${(dy * (1 - move)).toFixed(1)}px) scale(${sc.toFixed(4)})`;
        w.style.opacity = slam > 0 ? 1 : 0;
        w.style.zIndex = 10 + i;
        b.style.zIndex = move < 1 && slam > 0 ? 20 : 1;
        // the colour plate fills the screen with the word, then collapses into its row with it
        const plate = gl.easeOutQuart(slam);
        bg.style.top = `${(-r.top * (1 - move)).toFixed(1)}px`;
        bg.style.height = `${gl.lerp(vh, r.height, move).toFixed(1)}px`;
        bg.style.clipPath = `inset(${((1 - plate) * 100).toFixed(2)}% 0 0 0)`;
        const ns = gl.easeOutQuart(gl.seg(p, s + 0.2, s + 0.3));
        n.style.opacity = ns; n.style.transform = `translateY(${(1 - ns) * 10}px)`;
      });
    },
  };
</script>
<script src="../_runtime.js"></script>
</body>
</html>
