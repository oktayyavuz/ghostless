<style>
  :root { --paper: #efe8dc; --field: #c9542c; --deep: #7c2d14; --ink: #1d1712; --mute: #7a6e60; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 13px/1.5 "DM Mono", ui-monospace, monospace; overflow: hidden;
         display: grid; grid-template-columns: 1.35fr 1fr; }
  .stage { position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside { padding: 34px 40px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  .top b { font: 800 22px/1 Syne, system-ui, sans-serif; color: var(--ink); letter-spacing: -.02em; text-transform: none; }
  h1 { font: 800 clamp(44px, 5.4vw, 80px)/.92 Syne, system-ui, sans-serif; letter-spacing: -.04em; }
  h1 span { color: var(--field); }
  aside p { color: var(--mute); max-width: 32ch; margin-top: 18px; }
  .menu { list-style: none; padding: 0; }
  .menu li { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #d6cbb9; font-size: 14px; }
  .menu li b { font-weight: 500; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; } aside { padding: 18px; } aside p { display: none; } }
</style>

  <div class="stage"><canvas id="c" role="img" aria-label="Eski teneke kahve kavurucusu, beyaz zemininden kesilip kiremit rengi bir alana konur"></canvas></div>
  <aside>
    <div class="top"><b>Lodos</b><span>Kahve listesi</span></div>
    <div>
      <h1>Kavurmayı<br><span>biz yaparız.</span></h1>
      <p>Her sabah 07.00'de, 12 kg'lık tek kazanla. Çekirdek ne kadar kavrulduysa raf o kadar dolu.</p>
    </div>
    <ul class="menu">
      <li><b>Lodos harmanı, 250 g</b><span>₺420</span></li>
      <li><b>Etiyopya Guji, 250 g</b><span>₺560</span></li>
      <li><b>Türk kahvesi</b><span>₺80</span></li>
      <li><b>Filtre kahve</b><span>₺95</span></li>
    </ul>
  </aside>
<script>
  const c = document.getElementById("c"), x = c.getContext("2d");
  const photo = new Image(); photo.src = "../../assets/kavurucu.webp";
  const thumb = new Image(); thumb.src = THUMB;
  const mask = document.createElement("canvas"), obj = document.createElement("canvas"), shd = document.createElement("canvas");
  let ok = false, last = 1, R;
  function buildMask() {
    // flood-fill the light studio backdrop from the borders; whatever the fill can't reach is the roaster
    const w = thumb.naturalWidth, h = thumb.naturalHeight, t = document.createElement("canvas"); t.width = w; t.height = h;
    const tx = t.getContext("2d"); tx.drawImage(thumb, 0, 0);
    const d = tx.getImageData(0, 0, w, h).data, bg = new Uint8Array(w * h), stack = [];
    const CUT = Math.round(h * 0.776);                     // the turntable under the legs is not part of the object
    const light = (i) => d[i * 4] > 140;
    for (let xx = 0; xx < w; xx++) { stack.push(xx, (h - 1) * w + xx); }
    for (let y = 0; y < h; y++) { stack.push(y * w, y * w + w - 1); }
    while (stack.length) {
      const i = stack.pop();
      if (bg[i] || !light(i)) continue;
      bg[i] = 1; const xx = i % w, y = (i / w) | 0;
      if (xx > 0) stack.push(i - 1); if (xx < w - 1) stack.push(i + 1);
      if (y > 0) stack.push(i - w); if (y < h - 1) stack.push(i + w);
    }
    mask.width = w; mask.height = h;
    const mx = mask.getContext("2d"), m = mx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      const y = (i / w) | 0, xx = i % w;
      let keep = !bg[i] && y < CUT;
      // below the box only the four black legs belong to it, not the shadow or the turntable rim
      if (y > h * 0.685) keep = keep && d[i * 4] < 30 && xx > w * 0.22 && xx < w * 0.7;
      m.data[i * 4 + 3] = keep ? 255 : 0;
    }
    mx.putImageData(m, 0, 0);
  }
  function setup() {
    const r = c.getBoundingClientRect(); c.width = Math.round(r.width); c.height = Math.round(r.height);
    const W = c.width, H = c.height, iw = photo.naturalWidth, ih = photo.naturalHeight;
    const s = Math.min((W * 0.74) / iw, (H * 0.74) / ih), w = iw * s, h = ih * s;
    R = { x: (W - w) / 2, y: (H - h) / 2 + H * 0.02, w, h };
    for (const cv of [obj, shd]) { cv.width = W; cv.height = H; }
    // object layer: full-res photo kept only where the mask says "roaster"
    const ox = obj.getContext("2d");
    ox.drawImage(photo, R.x, R.y, R.w, R.h);
    ox.globalCompositeOperation = "destination-in";
    ox.filter = "blur(0.6px)"; ox.drawImage(mask, R.x, R.y, R.w, R.h); ox.filter = "none";
    ox.globalCompositeOperation = "source-over";
    // flat collage shadow: the same silhouette in a darker field colour
    const sx = shd.getContext("2d");
    sx.drawImage(mask, R.x, R.y, R.w, R.h);
    sx.globalCompositeOperation = "source-in"; sx.fillStyle = "#7c2d14"; sx.fillRect(0, 0, W, H); sx.globalCompositeOperation = "source-over";
  }
  window.demo = {
    duration: 2800,
    render(p) {
      last = p; if (!ok) return;
      const W = c.width, H = c.height;
      const k = gl.easeInOutCubic(gl.seg(p, 0.14, 0.62));   // backdrop disappears, colour field comes in
      const f = gl.easeOutQuart(gl.seg(p, 0.5, 0.95));      // the object lifts off with a hard shadow
      x.clearRect(0, 0, W, H);
      x.fillStyle = `rgba(201,84,44,${k})`; x.fillRect(0, 0, W, H);
      x.globalAlpha = 1 - k; x.drawImage(photo, R.x, R.y, R.w, R.h); x.globalAlpha = 1;
      const sc = 1 + 0.06 * f, cx = R.x + R.w / 2, cy = R.y + R.h * 0.78;
      x.save(); x.translate(cx, cy); x.scale(sc, sc); x.translate(-cx, -cy);
      if (f > 0) { x.globalAlpha = f; x.drawImage(shd, 18 * f, 14 * f); x.globalAlpha = 1; }
      x.drawImage(obj, 0, -10 * f);
      x.restore();
      if (k < 1) { x.strokeStyle = `rgba(29,23,18,${0.5 * (1 - k)})`; x.lineWidth = 1; x.strokeRect(R.x + 0.5, R.y + 0.5, R.w - 1, R.h - 1); }
    },
  };
  Promise.all([photo.decode(), thumb.decode()]).then(() => { buildMask(); setup(); ok = true; demo.render(last); });
  addEventListener("resize", () => { if (ok) { setup(); demo.render(last); } });
</script>
