<script>
  const c = document.getElementById("c"), x = c.getContext("2d");
  const RAMP = " .`:-=+*cox%#&@";
  const FONT = '700 12px "JetBrains Mono", ui-monospace, monospace', CH = 13;
  const photo = new Image(); photo.src = "../../assets/espresso.webp";
  const thumb = new Image(); thumb.src = THUMB;
  const g = document.createElement("canvas"), gx = g.getContext("2d");
  let cols, rows, cw, lum, ok = false, last = 1;
  const cover = (iw, ih, w, h) => { const s = Math.max(w / iw, h / ih), sw = w / s, sh = h / s; return [(iw - sw) / 2, (ih - sh) / 2, sw, sh]; };
  function setup() {
    const r = c.getBoundingClientRect(); c.width = Math.round(r.width); c.height = Math.round(r.height);
    x.font = FONT; cw = x.measureText("M").width;
    cols = Math.ceil(c.width / cw); rows = Math.ceil(c.height / CH);
    g.width = cols; g.height = rows;
    gx.drawImage(thumb, ...cover(thumb.naturalWidth, thumb.naturalHeight, cols * cw, rows * CH), 0, 0, cols, rows);
    const d = gx.getImageData(0, 0, cols, rows).data;
    lum = new Float32Array(cols * rows);
    for (let i = 0; i < lum.length; i++) lum[i] = Math.min(1, Math.max(0, (d[i * 4] / 255 - 0.04) * 1.4));
  }
  window.demo = {
    duration: 3200,
    render(p) {
      last = p; if (!ok) return;
      const W = c.width, H = c.height;
      x.clearRect(0, 0, W, H);
      const fade = gl.easeInOutCubic(gl.seg(p, 0.55, 0.92));
      if (fade > 0) { x.globalAlpha = fade; x.drawImage(photo, ...cover(photo.naturalWidth, photo.naturalHeight, cols * cw, rows * CH), 0, 0, cols * cw, rows * CH); }
      x.globalAlpha = 1 - fade;
      if (fade >= 1) { x.globalAlpha = 1; return; }
      x.font = FONT; x.textBaseline = "top";
      const front = gl.seg(p, 0, 0.45) * (rows + 8);   // rows are typed in from the top, last few still scrambling
      const tick = Math.floor(p * 60);
      for (let y = 0; y < rows; y++) {
        if (y > front) break;
        const scramble = front - y < 8 && p < 0.45;
        for (let i = 0; i < cols; i++) {
          const l = lum[y * cols + i];
          let ch = RAMP[Math.min(RAMP.length - 1, Math.floor(l * RAMP.length))];
          if (scramble && ch !== " ") ch = RAMP[1 + (((i * 73856093) ^ (y * 19349663) ^ (tick * 83492791)) >>> 0) % (RAMP.length - 1)];
          if (ch === " ") continue;
          x.fillStyle = scramble ? "#e9a24a" : `rgba(240,226,196,${0.35 + 0.65 * l})`;
          x.fillText(ch, i * cw, y * CH);
        }
      }
      x.globalAlpha = 1;
    },
  };
  Promise.all([photo.decode(), thumb.decode(), document.fonts.load(FONT).catch(() => {})])
    .then(() => { setup(); ok = true; demo.render(last); });
  addEventListener("resize", () => { if (ok) { setup(); demo.render(last); } });
</script>
