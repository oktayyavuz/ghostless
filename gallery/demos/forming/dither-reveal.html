<style>
  :root { --ink: #17130f; --paper: #efe6d2; --mute: #8d8475; --amber: #d98b3a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--paper); font: 400 13px/1.55 "IBM Plex Mono", ui-monospace, monospace;
         overflow: hidden; display: grid; grid-template-columns: 1fr 1.7fr; }
  aside { padding: 34px 36px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #2c261f; }
  .top { display: flex; justify-content: space-between; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
  .top b { color: var(--paper); font-weight: 500; }
  h1 { font: 400 clamp(54px, 6.8vw, 100px)/.9 "Instrument Serif", Georgia, serif; letter-spacing: -.01em; }
  h1 i { color: var(--amber); }
  aside p { color: var(--mute); max-width: 30ch; margin-top: 22px; }
  .mode { display: flex; gap: 10px; align-items: center; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
  .mode span { padding: 4px 8px; border: 1px solid #3a332a; }
  .mode span.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .stage { position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 52vh; } aside { padding: 20px; gap: 16px; } aside p { display: none; } }
</style>

  <div class="stage"><canvas id="c" role="img" aria-label="Barista portafiltreyi tutuyor, fincana espresso akıyor"></canvas></div>
<script>
  const c = document.getElementById("c"), x = c.getContext("2d");
  const m1 = document.getElementById("m1"), m2 = document.getElementById("m2");
  const CELL = 4, INK = [23, 19, 15], PAPER = [239, 230, 210];
  // 8×8 Bayer matrix, normalised to (0,1)
  const B = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
             3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map((v) => (v + 0.5) / 64);
  const photo = new Image(); photo.src = "../../assets/barista.webp";
  const thumb = new Image(); thumb.src = THUMB;          // small copy for reading pixels (works from file:// too)
  const grid = document.createElement("canvas"), gx = grid.getContext("2d");
  let cols, rows, lum, frame, ok = false, last = 1;
  const cover = (iw, ih, w, h) => { const s = Math.max(w / iw, h / ih), sw = w / s, sh = h / s; return [(iw - sw) / 2, (ih - sh) / 2, sw, sh]; };
  function setup() {
    const r = c.getBoundingClientRect(); c.width = Math.round(r.width); c.height = Math.round(r.height);
    cols = Math.ceil(c.width / CELL); rows = Math.ceil(c.height / CELL);
    grid.width = cols; grid.height = rows;
    gx.drawImage(thumb, ...cover(thumb.naturalWidth, thumb.naturalHeight, cols, rows), 0, 0, cols, rows);
    const d = gx.getImageData(0, 0, cols, rows).data;
    lum = new Float32Array(cols * rows);
    for (let i = 0; i < lum.length; i++) {
      const l = (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]) / 255;
      lum[i] = Math.min(1, Math.max(0, (l - 0.06) * 1.35));   // a little contrast so the 1-bit read is crisp
    }
    frame = gx.createImageData(cols, rows);
  }
  window.demo = {
    duration: 3000,
    render(p) {
      last = p; if (!ok) return;
      const W = c.width, H = c.height;
      const k = Math.pow(gl.seg(p, 0, 0.42), 0.8);         // dots appear, brightest tones first
      const r = gl.easeInOutCubic(gl.seg(p, 0.5, 0.97));    // then cells open to full tone in Bayer order
      const d = frame.data;
      for (let y = 0; y < rows; y++) for (let xx = 0; xx < cols; xx++) {
        const i = y * cols + xx, b = B[(y & 7) * 8 + (xx & 7)], o = i * 4;
        if (b < r) { d[o + 3] = 0; continue; }
        const on = lum[i] > 1 - k * (1 - b), col = on ? PAPER : INK;
        d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
      }
      gx.putImageData(frame, 0, 0);
      x.clearRect(0, 0, W, H);
      if (r > 0) { x.imageSmoothingEnabled = true; x.drawImage(photo, ...cover(photo.naturalWidth, photo.naturalHeight, cols * CELL, rows * CELL), 0, 0, cols * CELL, rows * CELL); }
      x.imageSmoothingEnabled = false;
      x.drawImage(grid, 0, 0, cols * CELL, rows * CELL);
      m1.className = r < 0.5 ? "on" : ""; m2.className = r < 0.5 ? "" : "on";
    },
  };
  Promise.all([photo.decode(), thumb.decode()]).then(() => { setup(); ok = true; demo.render(last); });
  addEventListener("resize", () => { if (ok) { setup(); demo.render(last); } });
</script>
