<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sıvı geçiş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #121110; --bone: #ece5d8; --mute: #8a8378; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--bone); font: 400 14px/1.5 "Work Sans", system-ui, sans-serif; overflow: hidden;
         display: grid; grid-template-rows: auto 1fr auto; gap: 18px; padding: 24px 40px 28px; }
  header { display: flex; justify-content: space-between; align-items: baseline; color: var(--mute); font-size: 13px; }
  header b { font: 500 22px/1 "Bodoni Moda", Didot, serif; color: var(--bone); letter-spacing: .01em; }
  .stage { position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  footer { display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: end; }
  .idx { font: 500 13px/1 "Work Sans"; color: var(--mute); letter-spacing: .1em; }
  .caps { position: relative; height: 1.1em; font: italic 400 clamp(30px, 3.6vw, 50px)/1.1 "Bodoni Moda", Didot, serif; }
  .caps span { position: absolute; left: 0; bottom: 0; white-space: nowrap; will-change: opacity, transform; }
  footer p { color: var(--mute); text-align: right; max-width: 30ch; }
  @media (max-width: 700px) { body { padding: 16px; } footer { grid-template-columns: 1fr; gap: 8px; } footer p { text-align: left; } }
</style>
</head>
<body>
  <header><b>Lodos</b><span>Karaköy'den iki saat: sabah ve akşam</span></header>
  <div class="stage"><canvas id="c" role="img" aria-label="Sabah Boğaz manzarası dalgalanarak akşam Boğaz Köprüsü görüntüsüne dönüşür"></canvas></div>
  <footer>
    <span class="idx" id="idx">01 / 02</span>
    <div class="caps"><span id="cap1">Sabah, Karaköy iskelesi</span><span id="cap2">Akşam, Boğaz Köprüsü</span></div>
    <p>İlk vapur 07.00'de, son paket 19.00'da. Arada her şey aynı kazandan.</p>
  </footer>
<script>
  const c = document.getElementById("c"), cap1 = document.getElementById("cap1"), cap2 = document.getElementById("cap2"), idx = document.getElementById("idx");
  const A = new Image(), B = new Image(); A.src = "../../assets/deniz.webp"; B.src = "../../assets/kopru.webp";
  let draw = null, last = 1;

  // ---- WebGL path: one shader warps both photos through the same fractal-noise field
  const VS = "attribute vec2 p; varying vec2 v; void main(){ v = p * .5 + .5; v.y = 1. - v.y; gl_Position = vec4(p, 0., 1.); }";
  const FS = `precision highp float; varying vec2 v; uniform sampler2D ta, tb; uniform float t, ra, rb; uniform vec2 res;
    float h(vec2 q){ return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 q){ vec2 i = floor(q), f = fract(q); f = f*f*(3.-2.*f);
      return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 q){ float s = 0., a = .5; for (int k = 0; k < 5; k++){ s += a * n(q); q *= 2.03; a *= .5; } return s; }
    vec2 cover(vec2 uv, float r){ float s = res.x / res.y; return r > s ? vec2((uv.x - .5) * s / r + .5, uv.y) : vec2(uv.x, (uv.y - .5) * r / s + .5); }
    void main(){
      vec2 q = v * vec2(res.x / res.y, 1.) * 2.2;
      float w = fbm(q), amp = sin(3.14159 * t);
      vec2 d = (vec2(fbm(q + 4.7), fbm(q + 9.1)) - .5) * .2 * amp;
      float edge = clamp((w * .7 + (1. - v.x) * .3 - .2) / .6, 0., 1.);                       // liquid front travels left to right
      float m = smoothstep(edge - .08, edge + .08, t * 1.2 - .1);
      vec4 a = texture2D(ta, cover(v + d * (1. + m), ra));
      vec4 b = texture2D(tb, cover(v - d * (2. - m), rb));
      gl_FragColor = mix(a, b, m);
    }`;
  function tryWebGL() {
    const g = c.getContext("webgl", { preserveDrawingBuffer: true, premultipliedAlpha: false });
    if (!g) return null;
    const sh = (type, src) => { const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s); return s; };
    const pr = g.createProgram(); g.attachShader(pr, sh(g.VERTEX_SHADER, VS)); g.attachShader(pr, sh(g.FRAGMENT_SHADER, FS)); g.linkProgram(pr);
    if (!g.getProgramParameter(pr, g.LINK_STATUS)) return null;
    g.useProgram(pr);
    g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer());
    g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW);
    const loc = g.getAttribLocation(pr, "p"); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
    const tex = (img, unit) => {
      g.activeTexture(g.TEXTURE0 + unit); g.bindTexture(g.TEXTURE_2D, g.createTexture());
      for (const [k, val] of [[g.TEXTURE_MIN_FILTER, g.LINEAR], [g.TEXTURE_MAG_FILTER, g.LINEAR], [g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE], [g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE]]) g.texParameteri(g.TEXTURE_2D, k, val);
      g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, g.RGBA, g.UNSIGNED_BYTE, img);   // throws on file:// (cross-origin), caught below
    };
    try { tex(A, 0); tex(B, 1); } catch (e) { return null; }
    if (g.getError() !== g.NO_ERROR) return null;
    const U = (n) => g.getUniformLocation(pr, n);
    g.uniform1i(U("ta"), 0); g.uniform1i(U("tb"), 1);
    g.uniform1f(U("ra"), A.naturalWidth / A.naturalHeight); g.uniform1f(U("rb"), B.naturalWidth / B.naturalHeight);
    return (t) => {
      g.viewport(0, 0, c.width, c.height); g.uniform2f(U("res"), c.width, c.height); g.uniform1f(U("t"), t);
      g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
    };
  }

  // ---- Canvas 2D fallback (file://, no WebGL): rows slide on a noise curve, a noise mask carries B over A
  function canvasPath() {
    const cv = document.createElement("canvas"); // fresh 2D canvas, the WebGL one can't switch context
    cv.style.cssText = c.style.cssText; cv.setAttribute("role", "img"); cv.setAttribute("aria-label", c.getAttribute("aria-label"));
    c.replaceWith(cv);
    const x = cv.getContext("2d"), la = document.createElement("canvas"), lb = document.createElement("canvas");
    const ax = la.getContext("2d"), bx = lb.getContext("2d"), mk = document.createElement("canvas"), mx = mk.getContext("2d");
    const hash = (i, j) => { let k = (i * 374761393 + j * 668265263) ^ 0x5bd1e995; k = Math.imul(k ^ (k >>> 13), 1274126177); return ((k ^ (k >>> 16)) >>> 0) / 4294967295; };
    const vn = (px, py) => { const i = Math.floor(px), j = Math.floor(py), fx = px - i, fy = py - j, u = fx * fx * (3 - 2 * fx), w = fy * fy * (3 - 2 * fy);
      const a = hash(i, j), b = hash(i + 1, j), cc = hash(i, j + 1), d = hash(i + 1, j + 1); return a + (b - a) * u + (cc - a) * w + (a - b - cc + d) * u * w; };
    const fbm = (px, py) => { let s = 0, a = 0.5; for (let k = 0; k < 4; k++) { s += a * vn(px, py); px *= 2.03; py *= 2.03; a *= 0.5; } return s / 0.9375; };
    let N, mw, mh, mImg;
    const cover = (img, w, h) => { const s = Math.max(w / img.naturalWidth, h / img.naturalHeight); return [(img.naturalWidth - w / s) / 2, (img.naturalHeight - h / s) / 2, w / s, h / s]; };
    function size() {
      const r = cv.getBoundingClientRect(); cv.width = la.width = lb.width = Math.round(r.width); cv.height = la.height = lb.height = Math.round(r.height);
      mw = Math.ceil(cv.width / 4); mh = Math.ceil(cv.height / 4); mk.width = mw; mk.height = mh; mImg = mx.createImageData(mw, mh);
      N = new Float32Array(mw * mh); const asp = mw / mh;
      let lo = 9, hi = -9;
      for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) { const e = fbm((i / mw) * asp * 2.2, (j / mh) * 2.2) * 0.7 + (1 - i / mw) * 0.3; N[j * mw + i] = e; lo = Math.min(lo, e); hi = Math.max(hi, e); }
      for (let i = 0; i < N.length; i++) N[i] = (N[i] - lo) / (hi - lo);
    }
    size(); addEventListener("resize", () => { size(); demo.render(last); });
    function warp(ctx, img, W, H, amp, sign) {
      const src = cover(img, W, H), BAND = 3, sy = src[3] / H;
      ctx.clearRect(0, 0, W, H);
      for (let y = 0; y < H; y += BAND) {
        const dx = (fbm(y / H * 2.6, 3.1) - 0.5) * amp * W * sign + Math.sin(y / H * 9) * amp * W * 0.15 * sign;
        ctx.drawImage(img, src[0], src[1] + y * sy, src[2], BAND * sy, dx - Math.abs(amp) * W * 0.8, y, W * (1 + Math.abs(amp) * 1.6), BAND);
      }
    }
    return (t) => {
      const W = cv.width, H = cv.height, amp = Math.sin(Math.PI * t) * 0.34;
      warp(ax, A, W, H, amp * 1.2, 1); warp(bx, B, W, H, amp * 1.6, -1);
      const d = mImg.data, th = t * 1.2 - 0.1;
      for (let i = 0; i < N.length; i++) { const e = N[i]; d[i * 4 + 3] = 255 * gl.clamp((th - (e - 0.08)) / 0.16); }
      mx.putImageData(mImg, 0, 0);
      bx.globalCompositeOperation = "destination-in"; bx.drawImage(mk, 0, 0, W, H); bx.globalCompositeOperation = "source-over";
      x.clearRect(0, 0, W, H);
      if (t < 1) x.drawImage(la, 0, 0);
      if (t > 0) x.drawImage(lb, 0, 0);
    };
  }

  function size() { const r = c.getBoundingClientRect(); c.width = Math.round(r.width); c.height = Math.round(r.height); }
  window.demo = {
    duration: 3000,
    render(p) {
      last = p;
      const t = 0.5 - 0.5 * Math.cos(Math.PI * gl.seg(p, 0.03, 0.95));
      if (draw) draw(t);
      const k = gl.seg(p, 0.4, 0.7);
      cap1.style.opacity = 1 - k; cap1.style.transform = `translateY(${-k * 14}px)`;
      cap2.style.opacity = k; cap2.style.transform = `translateY(${(1 - k) * 14}px)`;
      idx.textContent = p < 0.55 ? "01 / 02" : "02 / 02";
    },
  };
  size();
  Promise.all([A.decode(), B.decode()]).then(() => {
    draw = tryWebGL();
    document.documentElement.dataset.renderer = draw ? "webgl" : "canvas";
    if (!draw) draw = canvasPath();
    demo.render(last);
  });
  addEventListener("resize", () => { if (c.isConnected) { size(); demo.render(last); } });
</script>
<script src="../_runtime.js"></script>
</body>
</html>
