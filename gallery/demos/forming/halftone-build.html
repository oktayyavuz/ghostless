<style>
  :root { --paper: #f1e9da; --ink: #2a1a12; --rust: #c4462a; --mute: #7b6c5c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 15px/1.45 "Courier Prime", ui-monospace, monospace;
         overflow: hidden; display: grid; grid-template-columns: 1.7fr 1fr; gap: 0 36px; padding: 32px; }
  .stage { position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  aside { display: flex; flex-direction: column; justify-content: space-between; padding: 4px 4px 0 0; }
  .top { display: flex; justify-content: space-between; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  h1 { font-family: Oswald, Impact, sans-serif; font-weight: 700; text-transform: uppercase; line-height: .84; letter-spacing: -.01em; }
  h1 small { display: block; font-size: clamp(30px, 3.6vw, 52px); }
  h1 big { display: block; font-size: clamp(96px, 13.2vw, 200px); color: var(--rust); letter-spacing: -.03em; }
  .rule { border-top: 3px solid var(--ink); padding-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 14px; }
  .rule b { display: block; font-family: Oswald, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 18px; letter-spacing: .02em; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 48vh 1fr; padding: 16px; gap: 14px; } .rule { display: none; } }
</style>

  <div class="stage"><canvas id="c" role="img" aria-label="Çuval bezi üstünde fincan ve kavrulmuş çekirdekler, baskı noktalarıyla"></canvas></div>
  <aside>
    <div class="top"><span>Lodos Kavurma Evi</span><span>Karaköy</span></div>
    <h1><small>Her sabah kazan</small><big>07.00</big><small>ateşte.</small></h1>
    <div class="rule">
      <div><b>Bu hafta</b>Lodos harmanı, Etiyopya Guji, Kolombiya Huila, Türk kahvesi kavrumu</div>
      <div><b>Adres</b>Kemankeş Cd. 12<br>İskeleye 90 saniye</div>
    </div>
  </aside>
<script>
  const c = document.getElementById("c"), x = c.getContext("2d");
  const thumb = new Image(); thumb.src = THUMB;
  const g = document.createElement("canvas"), gx = g.getContext("2d");
  const CELL = 11;
  let dots = [], ok = false, last = 1;
  function setup() {
    const r = c.getBoundingClientRect(); c.width = Math.round(r.width); c.height = Math.round(r.height);
    const W = c.width, H = c.height, rowH = CELL * 0.866;
    const cols = Math.ceil(W / CELL) + 1, rows = Math.ceil(H / rowH) + 1;
    g.width = cols; g.height = rows;
    const iw = thumb.naturalWidth, ih = thumb.naturalHeight, s = Math.max(cols / iw, rows / ih);
    gx.drawImage(thumb, (iw - cols / s) / 2, (ih - rows / s) / 2, cols / s, rows / s, 0, 0, cols, rows);
    const d = gx.getImageData(0, 0, cols, rows).data;
    dots = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const o = (j * cols + i) * 4, l = (0.2126 * d[o] + 0.7152 * d[o + 1] + 0.0722 * d[o + 2]) / 255;
      const dark = Math.pow(Math.min(1, Math.max(0, (1 - l) * 1.08)), 1.7);
      const px = i * CELL + (j % 2 ? CELL / 2 : 0), py = j * rowH;
      // dots grow in a wave from the lower-left corner of the print
      const dist = Math.hypot(px / W, 1 - py / H) / Math.SQRT2;
      dots.push([px, py, Math.sqrt(dark), dist]);  // area ∝ darkness
    }
  }
  window.demo = {
    duration: 2800,
    render(p) {
      last = p; if (!ok) return;
      const W = c.width, H = c.height, R = CELL * 0.6;
      x.clearRect(0, 0, W, H);
      x.fillStyle = "#2a1a12";
      x.beginPath();
      for (const [px, py, k, dist] of dots) {
        const t = gl.easeOutQuart(gl.seg(p, dist * 0.6 - 0.06, dist * 0.6 + 0.32));
        const r = R * k * t;
        if (r < 0.35) continue;
        x.moveTo(px + r, py); x.arc(px, py, r, 0, Math.PI * 2);
      }
      x.fill();
    },
  };
  thumb.decode().then(() => { setup(); ok = true; demo.render(last); });
  addEventListener("resize", () => { if (ok) { setup(); demo.render(last); } });
</script>
