  <header><b>Lodos</b><span>Kahve Kavurma Evi · Karaköy · 2019</span></header>
  <footer id="foot"><h1>Boğaz'ın bu yakasında,<br><span>her sabah kavrulur.</span></h1><p>Akşam vapuruyla karşıya geçen her paket, sabah 07.00'de aynı kazandan çıktı.</p></footer>

  const photo = new Image(); photo.src = "../../assets/kopru.webp";
  const thumb = new Image(); thumb.src = THUMB;

    const iw = thumb.naturalWidth, ih = thumb.naturalHeight, s = Math.max(cols / iw, rows / ih);

    const d = gx.getImageData(0, 0, cols, rows).data, rnd = gl.rand(4207);
    P = [];
    const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) * 0.62;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const o = (j * cols + i) * 4, a = rnd() * Math.PI * 2, r = R * (0.15 + 0.85 * Math.sqrt(rnd()));
      P.push({
        tx: box.x + i * STEP, ty: box.y + j * STEP,
        sx: cx + Math.cos(a) * r, sy: cy + Math.sin(a) * r * 0.75,
        r: d[o], g: d[o + 1], b: d[o + 2],
        delay: rnd() * 0.22 + (i / cols) * 0.06, curl: (rnd() - 0.5) * 260,
      });
    }
    buf = x.createImageData(W, H);
    box.cover = (() => { const iw2 = photo.naturalWidth, ih2 = photo.naturalHeight, s2 = Math.max(box.w / iw2, box.h / ih2);
      return [(iw2 - box.w / s2) / 2, (ih2 - box.h / s2) / 2, box.w / s2, box.h / s2]; })();
  }
  window.demo = {
    duration: 3400,
    render(p) {
      last = p; if (!ok) return;
      const W = c.width, H = c.height, d = buf.data;
      d.fill(0);
      for (let k = 0; k < d.length; k += 4) { d[k] = 10; d[k + 1] = 14; d[k + 2] = 26; d[k + 3] = 255; }
      for (const q of P) {
        const t = gl.seg(p, q.delay, q.delay + 0.4), e = 1 - Math.pow(1 - t, 3);
        const sw = Math.sin(e * Math.PI) * q.curl;           // swirl sideways mid-flight
        const dx = q.tx - q.sx, dy = q.ty - q.sy, len = Math.hypot(dx, dy) || 1;
        const px = Math.round(q.sx + dx * e - (dy / len) * sw), py = Math.round(q.sy + dy * e + (dx / len) * sw);
        const size = Math.round(gl.lerp(3, STEP - 1, gl.seg(e, 0.7, 1)));
        if (px < 0 || py < 0 || px + size >= W || py + size >= H) continue;
        for (let yy = 0; yy < size; yy++) {
          let o = ((py + yy) * W + px) * 4;
          for (let xx = 0; xx < size; xx++, o += 4) { d[o] = q.r; d[o + 1] = q.g; d[o + 2] = q.b; }
        }
      }
      x.putImageData(buf, 0, 0);
      const f = gl.easeInOutCubic(gl.seg(p, 0.84, 1));       // settle into the real photograph
      if (f > 0) { x.globalAlpha = f; x.drawImage(photo, ...box.cover, box.x, box.y, Math.floor(box.w / STEP) * STEP - 1, Math.floor(box.h / STEP) * STEP - 1); x.globalAlpha = 1; }
      const ft = gl.easeOutQuart(gl.seg(p, 0.7, 1));
      foot.style.opacity = ft; foot.style.transform = `translateY(${(1 - ft) * 18}px)`;
    },
  };
  Promise.all([photo.decode(), thumb.decode()]).then(() => { setup(); ok = true; demo.render(last); });
  addEventListener("resize", () => { if (ok) { setup(); demo.render(last); } });
</script>
<script src="../_runtime.js"></script>
